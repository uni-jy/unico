name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Seed defaults without making a network request
        run: node --input-type=module -e "import { getLLMConfig } from './server/llm-client.js'; const c = getLLMConfig({}); if (c.model !== 'doubao-seed-2-1-pro-260915') process.exit(1);"
      - run: node --test tests/*.test.js
      - run: node --check server/setup-api.js
      - run: node --check pwa/src/player.js
